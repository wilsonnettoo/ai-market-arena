[project]
name = "arena"
version = "0.1.0"
description = "AI Market Arena — registro publico auditavel de previsoes de mercado"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "exchange-calendars>=4.5",
    "alpaca-py>=0.33",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# DTZ e deliberado: reprova datetime.now() sem timezone, que e a classe de bug
# mais provavel num projeto que carimba tempo.
select = ["E", "F", "I", "UP", "B", "DTZ"]
